name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile server and tools
        run: python -m py_compile server.py export_room.py

      - name: Verify the plugin build is up to date
        run: python build.py --check

      - name: Run server regression tests
        run: python -m unittest discover -s tests -v

  windows-package:
    needs: server
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package BloxyCola Create
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/BloxyCola-Create.zip HEAD -- \
            README.md PlaceTogether.rbxmx plugin_source.luau build.py server.py export_room.py \
            StartPlaceTogetherServer.bat InstallBloxyCola.bat InstallBloxyCola.ps1 assets tests

      - name: Install plugin and start server from ZIP
        run: python tests/smoke_windows_package.py dist/BloxyCola-Create.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BloxyCola-Create-windows
          path: dist/BloxyCola-Create.zip
          if-no-files-found: error
